<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css"/>
  <title>Frontend Mentor | Order summary card</title>
</head>
<body>
  <main>
    <div class="container">
      
  <img src="./images/illustration-hero.svg" alt="illustration-hero" class="illustration-hero-img"/>
  
    <div class="content">
  <h1>Order Summary</h1>

  <p class="summary">You can now listen to millions of songs, audiobooks, and podcasts on any 
  device anywhere you like!</p>

  <div class="annualplan">
  <img src="./images/icon-music.svg" alt="icon-music" class="icon-music"/>

  <div class="annualplan2">
  <h2>Annual Plan</h2>
  <p>$59.99/year</p>
  </div>

  <a href="">Change</a>
  </div>
 
  <div class="buttons">
  <button type="button" class="first-button"> Proceed to Payment</button>
  <button type="button" class="second-button">Cancel Order</button>
  </div>
  </div>
  </div>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by  <a href="https://www.linkedin.com/in/benita-edhemu/">Edhemu Benita Ufuoma</a>.
  </footer>
</body>
</html>
